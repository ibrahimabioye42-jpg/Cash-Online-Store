<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Cash Online Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .change-password-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .page-icon {
            width: 65px;
            height: 65px;
            background: #fff0e8;
            color: #f36b21;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border-radius: 50%;
            margin: 0 auto 18px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            border-color: #f36b21;
            box-shadow: 0 0 0 3px rgba(243, 107, 33, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #f36b21;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d95712;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #f36b21;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .flash-message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .flash-message.error {
            background: #ffe8e8;
            color: #b42318;
        }

        .flash-message.success {
            background: #e7f7ed;
            color: #187a3d;
        }

        @media (max-width: 480px) {
            .change-password-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="change-password-container">

        <div class="page-icon">🔒</div>

        <h2>Change Password</h2>

        <p class="description">
            Keep your Cash Online Store account secure.
            Enter your current password and choose a new one.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('change_password') }}">

            <label>Current Password</label>
            <input
                type="password"
                name="current_password"
                placeholder="Enter current password"
                required
            >

            <label>New Password</label>
            <input
                type="password"
                name="new_password"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label>Confirm New Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <a href="{{ url_for('account') }}" class="back-link">
            ← Back to My Account
        </a>

    </div>

</body>
</html>
