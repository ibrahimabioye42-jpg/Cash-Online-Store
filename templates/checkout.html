<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Cash Online Store</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Cash Online Store</h1>
        <a href="{{ url_for('home') }}">Continue Shopping</a>
    </header>

    <main class="container">
        <h2>Checkout</h2>

        <div class="product-card">
            {% if product.image %}
                <img src="{{ product.image }}"
                     alt="{{ product.name }}"
                     style="max-width: 250px;">
            {% endif %}

            <h3>{{ product.name }}</h3>
            <p>Category: {{ product.category }}</p>
            <p>Seller: {{ product.seller_name }}</p>
            <p>Price per item: GH₵ {{ "%.2f"|format(product.price) }}</p>
            <p>Available quantity: {{ product.quantity }}</p>

            <form method="POST"
                  action="{{ url_for('checkout', product_id=product.id) }}">

                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="{{ product.quantity }}"
                    value="1"
                    required>

                <button type="submit">Place Order</button>
            </form>
        </div>
    </main>
</body>
</html>
