<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Result - Cash Online Store</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="notifications-container">
        <h1>
            {% if success %}
                Payment Successful
            {% else %}
                Payment Not Confirmed
            {% endif %}
        </h1>

        <p>{{ message }}</p>

        <a href="{{ url_for('my_orders') }}">View My Orders</a>
        |
        <a href="{{ url_for('home') }}">Back to Store</a>
    </main>
</body>
</html>
