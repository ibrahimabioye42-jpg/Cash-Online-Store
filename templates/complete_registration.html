<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration | Cash Online Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: white;
            padding: 18px 7%;
            border-bottom: 1px solid #eee;
        }

        .logo {
            color: #222;
            font-size: 21px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            background: darkblue;
            color: white;
            padding: 8px 11px;
            border-radius: 7px;
            margin-right: 7px;
        }

        .container {
            width: 92%;
            max-width: 440px;
            background: white;
            margin: 45px auto;
            padding: 35px 28px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .verified-email {
            background: #eaf8ef;
            color: #16663c;
            padding: 12px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: darkblue;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        .error {
            color: #c62828;
            background: #fff0f0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header class="navbar">
    <a class="logo" href="{{ url_for('home') }}">
        <span>C</span> Cash Online Store
    </a>
</header>

<main class="container">

    <h2>Create your account</h2>

    <p>Just a few more details to get started.</p>

    <div class="verified-email">
        ✓ Verified email: <strong>{{ email }}</strong>
    </div>

    {% if error %}
        <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="POST"
          action="{{ url_for('complete_registration') }}">

        <label for="name">Full name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="100"
            required
        >

        <label for="password">Create password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="role">Choose account type</label>

        <select id="role" name="role" required>
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
        </select>

        <button type="submit">Create Account</button>

    </form>

</main>

</body>
</html>
